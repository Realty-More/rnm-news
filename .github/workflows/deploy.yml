# Builds the PWA and publishes it to GitHub Pages.
# Every 30 minutes it also refreshes the YouTube video list (public/data/youtube.json is written during the build).
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Address of the push-worker (repo Settings ▸ Variables ▸ PUSH_API). Empty = alerts hidden.
          VITE_PUSH_API: ${{ vars.PUSH_API }}
          # WhatsApp Channel invite link (repo variable WHATSAPP_CHANNEL). Empty = join buttons hidden.
          VITE_WHATSAPP_CHANNEL: ${{ vars.WHATSAPP_CHANNEL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub pauses scheduled workflows after 60 days without repository activity.
  # Re-enabling this workflow on each scheduled run keeps the video refresh going, without extra commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
